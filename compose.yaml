name: mewa-code

services:
  mewa-code:
    build:
      context: ./mewa-code
    container_name: mewa-code
    restart: unless-stopped
    stop_grace_period: 30s
    user: "${MEWA_UID:-1000}:${MEWA_GID:-1000}"
    environment:
      HOME: /home/data
      MEWA_STATE_DIR: /home/data
      XDG_CONFIG_HOME: /home/data/.config
      XDG_DATA_HOME: /home/data/.local/share
      XDG_STATE_HOME: /home/data/.local/state
      XDG_CACHE_HOME: /home/data/.cache
      NODE_COMPILE_CACHE: /home/data/.cache/node-compile-cache
      NPM_CONFIG_CACHE: /home/data/.cache/npm
      NPM_CONFIG_USERCONFIG: /home/data/.config/npm/npmrc
      COREPACK_HOME: /home/data/.cache/corepack
      NODE_REPL_HISTORY: /home/data/.local/state/node_repl_history
      SYNARA_MODE: web
      SYNARA_NO_BROWSER: "1"
      SYNARA_HOST: 0.0.0.0
      SYNARA_PORT: 3773
      SYNARA_AUTH_TOKEN: ${SYNARA_AUTH_TOKEN:?set SYNARA_AUTH_TOKEN}
      SYNARA_ALLOW_INSECURE_REMOTE: ${SYNARA_ALLOW_INSECURE_REMOTE:-1}
      SYNARA_PUBLIC_URL: ${SYNARA_PUBLIC_URL:-}
      SYNARA_HOME: /home/data/synara
      PI_CODING_AGENT_DIR: /home/data/pi
      PI_CODING_AGENT_SESSION_DIR: /home/data/pi/sessions
      PI_SKIP_VERSION_CHECK: "1"
      PI_TELEMETRY: "0"
      MEWA_BROWSER_URL: http://mewa-browser:8787
      MEWA_BROWSER_TOKEN: ${MEWA_BROWSER_TOKEN:?set MEWA_BROWSER_TOKEN}
      TZ: ${TZ:-Europe/Warsaw}
    working_dir: /workspace
    ports:
      - "127.0.0.1:${SYNARA_PORT:-3773}:3773"
    volumes:
      - type: bind
        source: ${MEWA_STATE_PATH:-./data}
        target: /home/data
        bind:
          create_host_path: false
      - type: bind
        source: ${MEWA_WORKSPACE_PATH:-.}
        target: /workspace
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:exec,nosuid,size=256m,mode=1777
      - /run:nosuid,size=32m,mode=755
    ulimits:
      core: 0
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3773/health').then(async r=>{
          if(!r.ok)throw new Error(String(r.status));const v=await r.json();
          if(v.status!=='ok'||v.startupReady!==true)process.exit(1);
          }).catch(()=>process.exit(1));
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  mewa-browser:
    build:
      context: ./mewa-browser
    container_name: mewa-browser
    restart: unless-stopped
    user: "${MEWA_UID:-1000}:${MEWA_GID:-1000}"
    environment:
      PORT: 8787
      MEWA_BROWSER_TOKEN: ${MEWA_BROWSER_TOKEN:?set MEWA_BROWSER_TOKEN}
      BROWSER_ARTIFACT_ROOT: /state/artifacts
      BROWSER_STATE_ROOT: /tmp/mewa-browser
      BROWSER_MAX_ARTIFACT_BYTES: ${BROWSER_MAX_ARTIFACT_BYTES:-67108864}
      BROWSER_MAX_TOTAL_ARTIFACT_BYTES: ${BROWSER_MAX_TOTAL_ARTIFACT_BYTES:-268435456}
      BROWSER_MAX_STATE_BYTES: ${BROWSER_MAX_STATE_BYTES:-268435456}
      BROWSER_MAX_SESSIONS: ${BROWSER_MAX_SESSIONS:-16}
      BROWSER_COMMAND_TIMEOUT_MS: ${BROWSER_COMMAND_TIMEOUT_MS:-120000}
      TZ: ${TZ:-Europe/Warsaw}
    expose:
      - "8787"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    shm_size: "512m"
    tmpfs:
      - /tmp:exec,nosuid,size=512m,mode=1777
      - /run:nosuid,size=32m,mode=755
      - /state:nosuid,size=320m,mode=700,uid=${MEWA_UID:-1000},gid=${MEWA_GID:-1000}
    ulimits:
      core: 0
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          require('node:http').get('http://127.0.0.1:8787/health',r=>
          process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1));
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
