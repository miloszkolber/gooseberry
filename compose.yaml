# Development and trusted private-network deployment example.
# Keep the controller publish binding on loopback unless an external
# authentication boundary is already in place for non-loopback access.
services:
    mewa:
        build:
            context: ./mewa-code
            dockerfile: Dockerfile
            target: controller
        image: ghcr.io/miloszkolber/mewa-code-controller:latest
        container_name: mewa-controller
        restart: unless-stopped
        working_dir: "${MEWA_PROJECT_PATH:?set an absolute host project path}"
        command:
            - bun
            - /app/mewa-code.js
            - --no-open
            - "${MEWA_PROJECT_PATH:?set an absolute host project path}"
        read_only: true
        environment:
            MEWA_CODE_HOST: "0.0.0.0"
            MEWA_CODE_PORT: "24242"
            MEWA_CODE_DATA_DIR: "/var/lib/mewa"
            PI_CODING_AGENT_DIR: "/home/bun/.pi/agent"
            MEWA_BROWSER_URL: "http://mewa-browser:8787"
            MEWA_CODE_TOKEN: "${MEWA_CODE_TOKEN:-}"
            MEWA_CODE_ALLOWED_ORIGINS: "${MEWA_CODE_ALLOWED_ORIGINS:-}"
            MEWA_BROWSER_TOKEN: "${MEWA_BROWSER_TOKEN:-mewa-internal-browser-token-v1-4d2f7c8a9e1b6d3f}"
            MEWA_MOUNT_ROOTS: "${MEWA_MOUNT_ROOTS:-${MEWA_PROJECT_PATH:?set an absolute host project path}}"
            MEWA_SSH_HOST: "${MEWA_SSH_HOST:-host.docker.internal}"
            MEWA_SSH_USER: "${MEWA_SSH_USER:-core}"
            MEWA_SSH_PORT: "${MEWA_SSH_PORT:-22}"
            MEWA_SSH_PRIVATE_KEY_FILE: "/run/secrets/mewa_ssh_key"
            MEWA_SSH_KNOWN_HOSTS_FILE: "/run/secrets/mewa_ssh_known_hosts"
        ports:
            - "127.0.0.1:${MEWA_CODE_PORT:-24242}:24242"
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            - mewa-state:/var/lib/mewa
            - pi-state:/home/bun/.pi
            - type: bind
              source: "${MEWA_PROJECT_PATH:?set an absolute host project path}"
              target: "${MEWA_PROJECT_PATH:?set an absolute host project path}"
              read_only: false
              bind:
                  create_host_path: false
            - type: bind
              source: "${MEWA_SSH_PRIVATE_KEY_FILE:?set the host SSH private-key file}"
              target: /run/secrets/mewa_ssh_key
              read_only: true
              bind:
                  create_host_path: false
            - type: bind
              source: "${MEWA_SSH_KNOWN_HOSTS_FILE:?set the host SSH known-hosts file}"
              target: /run/secrets/mewa_ssh_known_hosts
              read_only: true
              bind:
                  create_host_path: false
        tmpfs:
            - /tmp:size=64m,mode=1777
            - /run:size=16m,mode=755,uid=1000,gid=1000
        depends_on:
            mewa-browser:
                condition: service_healthy
        healthcheck:
            test:
                - CMD
                - bun
                - -e
                - "fetch('http://127.0.0.1:24242/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
            interval: 30s
            timeout: 5s
            start_period: 10s
            retries: 3
        networks:
            - mewa

    mewa-browser:
        build:
            context: ./mewa-browser
            dockerfile: Dockerfile
        image: ghcr.io/miloszkolber/mewa-browser:latest
        container_name: mewa-browser
        restart: unless-stopped
        read_only: true
        environment:
            MEWA_BROWSER_TOKEN: "${MEWA_BROWSER_TOKEN:-mewa-internal-browser-token-v1-4d2f7c8a9e1b6d3f}"
            PORT: "8787"
            BROWSER_ARTIFACT_ROOT: "/state/artifacts"
            BROWSER_STATE_ROOT: "/state/browser"
            BROWSER_MAX_ARTIFACT_BYTES: "67108864"
            BROWSER_MAX_TOTAL_ARTIFACT_BYTES: "268435456"
            BROWSER_MAX_STATE_BYTES: "268435456"
            BROWSER_MAX_SESSIONS: "16"
        expose:
            - "8787"
        tmpfs:
            - /tmp:size=128m,mode=1777,uid=1000,gid=1000
            - /run:size=16m,mode=755,uid=1000,gid=1000
            - /dev/shm:size=64m,mode=1777,uid=1000,gid=1000
            - /state/artifacts:size=256m,mode=700,uid=1000,gid=1000
            - /state/browser:size=256m,mode=700,uid=1000,gid=1000
        healthcheck:
            test:
                - CMD
                - node
                - -e
                - "fetch('http://127.0.0.1:8787/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
            interval: 30s
            timeout: 5s
            start_period: 10s
            retries: 3
        networks:
            - mewa

volumes:
    mewa-state:
    pi-state:

networks:
    mewa:
        internal: false
