# Trusted single-host deployment example. Image defaults own the runtime configuration.
services:
    gooseberry:
        build:
            context: ./gooseberry
            dockerfile: Dockerfile
            target: controller
        image: ghcr.io/miloszkolber/gooseberry:latest
        container_name: gooseberry
        restart: unless-stopped
        network_mode: host
        user: "${GOOSEBERRY_UID:?run ./scripts/setup-deployment.sh to set GOOSEBERRY_UID}:${GOOSEBERRY_GID:?run ./scripts/setup-deployment.sh to set GOOSEBERRY_GID}"
        read_only: true
        environment:
            HOME: /run
        env_file:
            - .gooseberry
        volumes:
            - "${GOOSEBERRY_DATA_PATH:?set a host data root}/gooseberry/app:/var/lib/gooseberry"
            - "${GOOSEBERRY_PROJECT_PATH:?set an absolute host project path}:${GOOSEBERRY_PROJECT_PATH:?set an absolute host project path}:ro"
        tmpfs:
            - /tmp:size=64m,mode=1777
            - /run:size=16m,mode=700,uid=${GOOSEBERRY_UID:?run ./scripts/setup-deployment.sh to set GOOSEBERRY_UID},gid=${GOOSEBERRY_GID:?run ./scripts/setup-deployment.sh to set GOOSEBERRY_GID}

    gooseberry-browser:
        build:
            context: ./gooseberry-browser
            dockerfile: Dockerfile
        image: ghcr.io/miloszkolber/gooseberry-browser:latest
        container_name: gooseberry-browser
        restart: unless-stopped
        network_mode: host
        user: "${GOOSEBERRY_UID:?run ./scripts/setup-deployment.sh to set GOOSEBERRY_UID}:${GOOSEBERRY_GID:?run ./scripts/setup-deployment.sh to set GOOSEBERRY_GID}"
        read_only: true
        environment:
            HOME: /run
            GOOSEBERRY_BROWSER_TOKEN: "${GOOSEBERRY_BROWSER_TOKEN:?set GOOSEBERRY_BROWSER_TOKEN in .gooseberry}"
        volumes:
            - "${GOOSEBERRY_DATA_PATH:?set a host data root}/gooseberry/browser:/var/lib/gooseberry-browser"
        tmpfs:
            - /tmp:size=128m,mode=1777
            - /run:size=16m,mode=700,uid=${GOOSEBERRY_UID:?run ./scripts/setup-deployment.sh to set GOOSEBERRY_UID},gid=${GOOSEBERRY_GID:?run ./scripts/setup-deployment.sh to set GOOSEBERRY_GID}
            - /dev/shm:size=64m,mode=1777
