name: Container images

on:
  schedule:
    - cron: "37 4 * * 0"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/container-images.yml"
      - "docker-compose.yaml"
      - "docker-compose.mcp.yaml"
      - ".dockerignore"
      - "LICENSE"
      - "NOTICE.md"
      - ".gooseberry.example"
      - "gooseberry/**"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - ".github/workflows/container-images.yml"
      - "docker-compose.yaml"
      - "docker-compose.mcp.yaml"
      - ".dockerignore"
      - "LICENSE"
      - "NOTICE.md"
      - ".gooseberry.example"
      - "gooseberry/**"

concurrency:
  group: container-images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Source validation
    uses: ./.github/workflows/ci.yml
    with:
      revision: ${{ github.sha }}
    permissions:
      contents: read

  build:
    name: Build ${{ matrix.target }} image
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: gooseberry
            image: gooseberry
          - target: browser
            image: gooseberry-browser
          - target: mcp
            image: gooseberry-mcp
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}

      - name: Record exact source revision
        id: source
        run: |
          echo "short=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          flavor: latest=false
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}
            org.opencontainers.image.version=${{ steps.source.outputs.version }}
          tags: |
            type=ref,event=tag
            type=raw,value=sha-${{ steps.source.outputs.short }}

      - name: Build container image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./gooseberry/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.source.outputs.version }}
            REVISION=${{ steps.source.outputs.revision }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          no-cache-filters: ${{ github.event_name == 'schedule' && 'git-runtime-trim,browser-packages,gooseberry' || '' }}

      - name: Promote current default-branch image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          current=$(git ls-remote origin "refs/heads/$DEFAULT_BRANCH" | cut -f1)
          if [ "$current" = "$(git rev-parse HEAD)" ]; then
            docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
          else
            echo 'Default branch advanced during this build; immutable image retained without changing latest.' >> "$GITHUB_STEP_SUMMARY"
          fi
