name: Normalize source filenames

on:
  push:
    branches: ["rewrite/mewa-code-foundation"]
    paths:
      - ".github/normalize-filenames.py"
      - ".github/check-filenames.ts"
      - ".github/workflows/normalize-filenames.yml"

permissions:
  contents: write

concurrency:
  group: normalize-source-filenames
  cancel-in-progress: false

jobs:
  normalize-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: rewrite/mewa-code-foundation
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Normalize source paths and add the permanent guard
        run: |
          set -euo pipefail
          python3 .github/normalize-filenames.py
          cp .github/check-filenames.ts mewa-code/scripts/check-filenames.ts
          python3 - <<'PY'
          import json
          from pathlib import Path

          package = Path("mewa-code/package.json")
          data = json.loads(package.read_text())
          scripts = data["scripts"]
          normalized = {}
          for name, command in scripts.items():
              if name == "lint":
                  normalized["check:filenames"] = "bun scripts/check-filenames.ts"
                  normalized["lint"] = "bun run check:filenames && biome check ."
              else:
                  normalized[name] = command
          data["scripts"] = normalized
          package.write_text(json.dumps(data, indent="\t") + "\n")

          agents = Path("AGENTS.md")
          text = agents.read_text()
          section = """## Source naming

- Source directories and source, test, component, and script filenames use lowercase kebab-case.
- Conventional lowercase entry and barrel names such as hindex.ts`, `main.tsx`, and `vite.config.ts` remain unchanged; suffixes such as `.test.tsx` stay dot-separated.
- React components, types, and exports may use PascalCase inside files, but filesystem paths remain kebab-case.
- `bun run check:filenames` enforces this convention across Mewa Code and the browser service.

"""
          if "## Source naming" not in text:
              marker = "## Verification\n"
              if marker not in text:
                  raise SystemExit("AGENTS.md verification section not found")
              text = text.replace(marker, section + marker, 1)
              agents.write_text(text)
          PY
          rm -f \
            .github/normalize-filenames.py \
            .github/check-filenames.ts \
            .github/workflows/normalize-filenames.yml
          git add -A

      - name: Validate controller and Web UI
        working-directory: mewa-code
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run format
          bun run check:filenames
          bun run check:deps
          bun run lint
          bun run typecheck
          bun run test
          bun run build
          bun run check:runtime

      - name: Validate Compose configuration
        env:
          MEWA_CODE_PORT: "24242"
          MEWA_CODE_TOKEN: ci-controller-token-0123456789abcdef0123456789
          MEWA_CODE_ALLOWED_ORIGINS: ""
          MEWA_BROWSER_TOKEN: ci-browser-token-0123456789abcdef0123456789
          MEWA_WORKSPACE_PATH: ${{ github.workspace }}/mewa-code
          MEWA_MOUNT_ROOTS: ${{ github.workspace }}
          MEWA_SSH_HOST: host.docker.internal
          MEWA_SSH_USER: ci
          MEWA_SSH_PORT: "22"
          MEWA_SSH_PRIVATE_KEY_FILE: /etc/hosts
          MEWA_SSH_KNOWN_HOSTS_FILE: /etc/hosts
        run: docker compose -f compose.yaml config --quiet

      - name: Validate isolated browser service
        working-directory: mewa-browser
        run: |
          bun run check
          bun run test

      - name: Commit validated normalization
        run: |
          set -euo pipefail
          git diff --check
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: standardize source filenames on kebab-case"
          git push origin HEAD:rewrite/mewa-code-foundation
