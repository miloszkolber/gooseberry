name: Apply final model management

on:
  push:
    branches: ["rewrite/mewa-code-foundation"]
    paths:
      - ".github/.mewa-final-*"
      - ".github/workflows/apply-final-model-management.yml"

permissions:
  contents: write

concurrency:
  group: apply-final-model-management
  cancel-in-progress: false

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: rewrite/mewa-code-foundation
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Apply reviewed model-management patch
        run: |
          set -euo pipefail
          cat .github/.mewa-final-* | base64 --decode | gzip --decompress > /tmp/mewa.patch
          actual="$(sha256sum /tmp/mewa.patch | awk '{print $1}')"
          test "$actual" = "0af13d735a52da1d395c934ae41eae9693df580d6395a46a87b324e6645b3580"
          git apply --index /tmp/mewa.patch
          rm -f .github/.mewa-final-* .github/workflows/apply-final-model-management.yml
          git add -A

      - name: Validate controller and Web UI
        working-directory: mewa-code
        run: |
          bun install --frozen-lockfile
          bun run check:deps
          bun run lint
          bun run typecheck
          bun run test
          bun run build
          bun run check:runtime

      - name: Validate Compose configuration
        env:
          MEWA_CODE_PORT: "24242"
          MEWA_CODE_TOKEN: ci-controller-token-0123456789abcdef0123456789
          MEWA_CODE_ALLOWED_ORIGINS: ""
          MEWA_BROWSER_TOKEN: ci-browser-token-0123456789abcdef0123456789
          MEWA_WORKSPACE_PATH: ${{ github.workspace }}/mewa-code
          MEWA_MOUNT_ROOTS: ${{ github.workspace }}
          MEWA_SSH_HOST: host.docker.internal
          MEWA_SSH_USER: ci
          MEWA_SSH_PORT: "22"
          MEWA_SSH_PRIVATE_KEY_FILE: /etc/hosts
          MEWA_SSH_KNOWN_HOSTS_FILE: /etc/hosts
        run: docker compose -f compose.yaml config --quiet

      - name: Validate isolated browser service
        working-directory: mewa-browser
        run: |
          bun run check
          bun run test

      - name: Commit validated implementation
        run: |
          set -euo pipefail
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add complete model and provider management"
          git push origin HEAD:rewrite/mewa-code-foundation
