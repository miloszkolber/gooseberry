name: Fix controller image pruning

on:
  push:
    branches: ["rewrite/mewa-code-foundation"]
    paths: [".github/workflows/fix-controller-image.yml"]

permissions:
  contents: write

concurrency:
  group: fix-controller-image-pruning
  cancel-in-progress: false

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: rewrite/mewa-code-foundation
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Extract runtime pruning into a checked script
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          script = dedent(r'''\
          #!/bin/sh
          set -eu

          source_node_modules=${1:?source node_modules directory is required}
          runtime_root=${2:?runtime root is required}
          runtime_node_modules="$runtime_root/node_modules"
          runtime_licenses="$runtime_root/licenses"

          rm -rf "$source_node_modules/@mewa-code"
          mkdir -p "$runtime_node_modules" "$runtime_licenses"
          cp -aL "$source_node_modules/." "$runtime_node_modules/"
          rm -rf "$runtime_node_modules/.bin"

          for package in pi-web-access; do
            for legal in LICENSE NOTICE; do
              source="$source_node_modules/$package/$legal"
              if [ -f "$source" ]; then
                cp -aL "$source" "$runtime_licenses/$legal-$package"
              fi
            done
          done

          rm -rf "$runtime_node_modules/@mewa-code" "$runtime_node_modules/pi-web-access"

          find "$runtime_node_modules" -type f \
            \( -name '*.test.js' -o -name '*.test.mjs' -o -name '*.test.ts' \) \
            -delete

          find "$runtime_node_modules" -type d \
            \( \
              -iname test -o -iname tests -o -iname __tests__ -o -iname fixture -o -iname fixtures -o \
              -iname __fixtures__ -o -iname example -o -iname examples -o -iname doc -o -iname docs -o \
              -iname documentation -o -iname benchmark -o -iname benchmarks -o -iname coverage -o \
              -iname .cache -o -iname cache -o -iname __pycache__ -o -iname .pytest_cache \
            \) \
            -exec find '{}' -type f \
              ! -iname 'license' ! -iname 'license.*' ! -iname 'license-*' \
              ! -iname 'notice' ! -iname 'notice.*' ! -iname 'notice-*' \
              -delete ';'

          find "$runtime_node_modules" -type f \
            ! \( \
              -iname 'license' -o -iname 'license.*' -o -iname 'license-*' -o \
              -iname 'notice' -o -iname 'notice.*' -o -iname 'notice-*' \
            \) \
            \( \
              -iname 'readme*' -o -iname 'changelog*' -o -iname 'history*' -o \
              -iname 'contributing*' -o -iname 'security*' -o -iname 'code_of_conduct*' -o \
              -iname '*.md' -o -iname '*.markdown' -o -iname '*.rst' -o -iname '*.adoc' -o \
              -iname '*.map' -o -iname '*.d.ts' -o -iname '*.ts' -o -iname '*.tsx' -o \
              -iname '*.mts' -o -iname '*.cts' -o -iname '*.test.*' -o -iname '*.spec.*' -o \
              -iname '*.log' -o -iname '.npmrc' -o -iname '.yarnrc*' -o -iname '.pnp.*' -o \
              -iname '.yarn-integrity' -o -iname '.package-lock.json' -o -iname 'package-lock.json' -o \
              -iname 'npm-shrinkwrap.json' -o -iname 'yarn.lock' -o -iname 'pnpm-lock.yaml' -o \
              -iname 'bun.lockb' \
            \) \
            -delete

          find "$runtime_node_modules" -depth -type d -empty -delete
          ''')

          prune_path = Path("mewa-code/scripts/prune-runtime-dependencies.sh")
          prune_path.write_text(script)

          dockerfile = Path("mewa-code/Dockerfile")
          text = dockerfile.read_text()
          start = text.index("RUN bun install --frozen-lockfile --production --filter '@mewa-code/server'")
          end = text.index("\n\nFROM ${BUN_IMAGE} AS controller", start)
          replacement = dedent(r'''\
          COPY scripts/prune-runtime-dependencies.sh /tmp/prune-runtime-dependencies.sh
          RUN bun install --frozen-lockfile --production --filter '@mewa-code/server' \
              && sh /tmp/prune-runtime-dependencies.sh packages/server/node_modules /runtime \
              && rm -f /tmp/prune-runtime-dependencies.sh
          ''').rstrip()
          dockerfile.write_text(text[:start] + replacement + text[end:])

          Path(".github/workflows/fix-controller-image.yml").unlink()
          PY
          sh -n mewa-code/scripts/prune-runtime-dependencies.sh
          git add -A

      - name: Validate source
        working-directory: mewa-code
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run check:filenames
          bun run lint
          bun run typecheck
          bun run test
          bun run build
          bun run check:runtime

      - name: Validate multi-architecture controller image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --target controller \
            --file mewa-code/Dockerfile \
            mewa-code

      - name: Commit validated fix
        run: |
          set -euo pipefail
          git diff --check
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: make controller runtime pruning portable"
          git push origin HEAD:rewrite/mewa-code-foundation
