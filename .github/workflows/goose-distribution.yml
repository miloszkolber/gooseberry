name: Goose distribution

on:
  schedule:
    - cron: "17 3 * * *"
  pull_request:
    paths: ["LICENSE", "NOTICE.md", "goose/**", ".github/workflows/goose-distribution.yml"]
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["LICENSE", "NOTICE.md", "goose/**", ".github/workflows/goose-distribution.yml"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable upstream version to validate and publish (blank uses goose/version)
        required: false
        type: string

concurrency:
  group: goose-distribution-${{ github.event.pull_request.number || 'release' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  UPSTREAM: https://github.com/aaif-goose/goose.git

jobs:
  select:
    name: Resolve immutable upstream candidate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.candidate.outputs.version }}
      commit: ${{ steps.candidate.outputs.commit }}
      build: ${{ steps.candidate.outputs.build }}
    steps:
      - uses: actions/checkout@v5
      - id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          pinned=$(tr -d '[:space:]' < goose/version)
          pinned_commit=$(tr -d '[:space:]' < goose/source-commit)
          [[ "$pinned" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$pinned_commit" =~ ^[0-9a-f]{40}$ ]]
          version=${INPUT_TAG:-$pinned}
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            version=$(gh api repos/aaif-goose/goose/releases/latest --jq 'select(.draft == false and .prerelease == false) | .tag_name')
          fi
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then test "$GITHUB_REF_NAME" = "$pinned"; fi
          test "$(printf '%s\n%s\n' "$pinned" "$version" | sort -V | tail -1)" = "$version"
          gh api "repos/aaif-goose/goose/releases/tags/$version" --jq 'select(.draft == false and .prerelease == false) | .tag_name' | grep -Fx "$version"
          commit=$(gh api "repos/aaif-goose/goose/commits/$version" --jq .sha)
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$version" == "$pinned" ]]; then test "$commit" = "$pinned_commit"; fi
          build=true
          if [[ "$GITHUB_EVENT_NAME" == schedule && "$version" == "$pinned" ]]; then
            export VERSION="$version"
            gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[] | select(.tag_name == env.VERSION and .draft == false) | [.assets[] | select(.size > 0) | .name]' > existing.json
            if [[ -s existing.json ]] && jq -e --arg version "$version" '
              (["gooseberry-goose-\($version)-linux-x86_64.tar.gz", "gooseberry-goose-\($version)-linux-aarch64.tar.gz", "SHA256SUMS", "GOOSE-PROVENANCE", "LICENSE", "NOTICE.md"] - .) == []
            ' existing.json >/dev/null; then
              mkdir metadata
              gh release download "$version" --dir metadata --pattern GOOSE-PROVENANCE --pattern SHA256SUMS
              sh goose/verify-release.sh metadata "$version" "$commit" metadata
              build=false
            fi
          fi
          printf 'version=%s\ncommit=%s\nbuild=%s\n' "$version" "$commit" "$build" >> "$GITHUB_OUTPUT"
          printf 'Candidate: **%s** (`%s`). Build required: **%s**.\n' "$version" "$commit" "$build" >> "$GITHUB_STEP_SUMMARY"

  validate:
    needs: select
    if: needs.select.outputs.build == 'true'
    uses: ./.github/workflows/ci.yml

  build:
    name: Build vanilla Goose (${{ matrix.arch }})
    needs: [select, validate]
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            container: quay.io/pypa/manylinux_2_28_x86_64@sha256:441c35fdc6ee809ff9260894f8468ab4fea8c15dc880f8700a3f81b7922c1cda
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64@sha256:8b5f2b4e8c072ae5aefeb659f22c03e1ff46e6a82f154b6c904b106c87e65ff7
    env:
      VERSION: ${{ needs.select.outputs.version }}
      COMMIT: ${{ needs.select.outputs.commit }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Install isolated build dependencies
        run: dnf install -y openssl-devel dbus-devel libxcb-devel cmake perl-core clang git tar curl jq procps-ng
      - name: Check out pinned upstream source
        run: |
          git clone --depth 1 --branch "$VERSION" "$UPSTREAM" upstream
          test "$(git -C upstream rev-parse HEAD)" = "$COMMIT"
          test "$(git -C upstream rev-parse "${VERSION}^{commit}")" = "$COMMIT"
      - name: Verify and prepare the approved source state
        run: |
          sh goose/tests/source-policy.test.sh upstream "$VERSION" "$COMMIT"
          sh goose/source-policy.sh "$VERSION" "$COMMIT" upstream prepare
      - uses: actions/setup-go@v6
        with:
          go-version-file: gooseberry/go.mod
          cache-dependency-path: gooseberry/go.sum
      - name: Check required ACP registrations and compile the production-adapter probe
        working-directory: gooseberry
        run: |
          go run ../goose/tests/compatibility.go -source ../upstream
          go build -trimpath -o ../acp-smoke ../goose/tests/compatibility.go
      - name: Install upstream-pinned Rust toolchain
        working-directory: upstream
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none --no-modify-path
          export PATH="$HOME/.cargo/bin:$PATH"
          rust=$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)
          [[ "$rust" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          rustup toolchain install "$rust" --profile minimal --target "${{ matrix.target }}"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "RUSTUP_TOOLCHAIN=$rust" >> "$GITHUB_ENV"
      - name: Build focused CLI with unchanged runtime code and locked dependencies
        working-directory: upstream
        run: >-
          cargo build --locked --release --target "${{ matrix.target }}" -p goose-cli --bin goose
          --no-default-features
          --features code-mode,aws-providers,nostr,rustls-tls,system-keyring
      - name: Strip unneeded symbols before runtime verification
        run: strip --strip-unneeded "upstream/target/${{ matrix.target }}/release/goose"
      - name: Verify binary, authenticated WebSocket ACP, persistence and reconnect
        run: |
          binary="$GITHUB_WORKSPACE/upstream/target/${{ matrix.target }}/release/goose"
          sh goose/verify-version.sh "$binary" "$VERSION"
          sh goose/source-policy.sh "$VERSION" "$COMMIT" upstream check
          export GOOSE_SERVER__SECRET_KEY=gooseberry-smoke-secret
          smoke_home=$(mktemp -d)
          env HOME="$smoke_home" GOOSE_PATH_ROOT="$smoke_home" XDG_CONFIG_HOME="$smoke_home/.config" XDG_DATA_HOME="$smoke_home/.local/share" "$binary" serve --host 127.0.0.1 --port 3284 --enable-scheduler > server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || :; wait "$pid" 2>/dev/null || :' EXIT
          for _ in $(seq 1 30); do
            kill -0 "$pid"
            if curl -fsS http://127.0.0.1:3284/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3284/health >/dev/null
          ./acp-smoke -source upstream -controller gooseberry/controller -url ws://127.0.0.1:3284/acp
      - name: Package one executable
        run: |
          mkdir package
          install -m755 "upstream/target/${{ matrix.target }}/release/goose" package/goose
          tar -czf "gooseberry-goose-${VERSION}-linux-${{ matrix.arch }}.tar.gz" -C package goose
      - uses: actions/upload-artifact@v7
        with:
          name: goose-${{ matrix.arch }}
          path: gooseberry-goose-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [select, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.release.outputs.revision }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: goose-*
          merge-multiple: true
      - name: Promote verified pin and publish complete release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.select.outputs.version }}
          COMMIT: ${{ needs.select.outputs.commit }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" || test "$GITHUB_REF" = "refs/tags/$VERSION"
          if [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]; then
            git fetch origin "$DEFAULT_BRANCH"
            test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          fi
          if git show-ref --verify --quiet "refs/tags/$VERSION"; then
            test "$(git show "$VERSION:goose/version")" = "$VERSION"
            test "$(git show "$VERSION:goose/source-commit")" = "$COMMIT"
          fi
          test -s "gooseberry-goose-${VERSION}-linux-x86_64.tar.gz"
          test -s "gooseberry-goose-${VERSION}-linux-aarch64.tar.gz"
          test -s LICENSE && test -s NOTICE.md
          printf 'goose-version=%s\nupstream-repository=%s\nupstream-commit=%s\n' "$VERSION" "$UPSTREAM" "$COMMIT" > GOOSE-PROVENANCE
          sh goose/source-policy.sh "$VERSION" "$COMMIT" >> GOOSE-PROVENANCE
          sha256sum gooseberry-goose-*.tar.gz LICENSE NOTICE.md > SHA256SUMS
          sh goose/verify-release.sh . "$VERSION" "$COMMIT"
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[] | select(.tag_name == env.VERSION)' > existing.json
          if [[ -s existing.json ]] && jq -e '.draft == false' existing.json >/dev/null; then
            # Published artifacts are immutable. A rerun verifies rather than clobbers them.
            mkdir published
            gh release download "$VERSION" --dir published --pattern GOOSE-PROVENANCE --pattern SHA256SUMS --pattern 'gooseberry-goose-*.tar.gz' --pattern LICENSE --pattern NOTICE.md
            sh goose/verify-release.sh published "$VERSION" "$COMMIT"
          fi
          pinned=$(tr -d '[:space:]' < goose/version)
          if [[ "$pinned" != "$VERSION" ]]; then
            test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
            printf '%s\n' "$VERSION" > goose/version
            printf '%s\n' "$COMMIT" > goose/source-commit
            git config user.name github-actions[bot]
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add goose/version goose/source-commit
            git commit -m "build: update vanilla Goose to $VERSION"
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi
          revision=$(git rev-parse HEAD)
          if [[ ! -s existing.json ]]; then
            gh release create "$VERSION" --target "$revision" --draft --title "Goose $VERSION for Gooseberry" --notes "Upstream Goose $VERSION at $COMMIT, with unchanged runtime code and the focused CLI feature selection. GOOSE-PROVENANCE records any exact approved local-workspace lock metadata correction; third-party dependency pins remain unchanged. Native Linux x86_64 and aarch64 builds pass the Gooseberry ACP compatibility gate. See SHA256SUMS for asset checksums."
          fi
          if [[ ! -s existing.json ]] || jq -e '.draft == true' existing.json >/dev/null; then
            gh release upload "$VERSION" gooseberry-goose-*.tar.gz SHA256SUMS GOOSE-PROVENANCE LICENSE NOTICE.md --clobber
            gh release edit "$VERSION" --target "$revision" --draft=false --latest
          fi
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"

  image:
    name: Rebuild Gooseberry after verified Goose publication
    needs: publish
    uses: ./.github/workflows/container-images.yml
    with:
      revision: ${{ needs.publish.outputs.revision }}
    permissions:
      contents: read
      packages: write
