name: Apply Mewa rewrite patch

on:
  push:
    branches: ["rewrite/mewa-code-foundation"]
    paths:
      - ".github/.mewa-patch-*"
      - ".github/workflows/apply-mewa-patch.yml"

permissions:
  contents: write

concurrency:
  group: apply-mewa-rewrite
  cancel-in-progress: false

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: rewrite/mewa-code-foundation
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Reassemble and apply the reviewed patch
        run: |
          set -euo pipefail
          cat .github/.mewa-patch-* | base64 --decode | gzip --decompress > /tmp/mewa.patch
          actual="$(sha256sum /tmp/mewa.patch | awk '{print $1}')"
          test "$actual" = "b7f116b506574993adf865654f755242039353315f9b9a4c8d59afcf2d494cd2"
          git apply --index /tmp/mewa.patch
          rm -f .github/.mewa-patch-* .github/workflows/apply-mewa-patch.yml
          git add -A

      - name: Refresh locked dependencies
        working-directory: mewa-code
        run: bun install

      - name: Normalize rewritten sources
        working-directory: mewa-code
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path("packages/contracts/src/index.ts"): (
                  "\tTERMINAL_REPLAY_KB,\n",
                  "",
              ),
              Path("packages/server/src/host/handlers.test.ts"): (
                  'import type { PiProfileDescriptor, Workspace } from "@mewa-code/contracts";',
                  'import type { PiProfileDescriptor } from "@mewa-code/contracts";',
              ),
              Path("webui/src/transport/transport.test.ts"): (
                  'import { encodeCodeTokenProtocol, WS_CHANNELS } from "@mewa-code/contracts";',
                  'import { encodeCodeTokenProtocol } from "@mewa-code/contracts";',
              ),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}")
              path.write_text(text.replace(old, new, 1))
          PY
          bun run format

      - name: Validate controller and Web UI
        working-directory: mewa-code
        run: |
          bun run check:deps
          bun run lint
          bun run typecheck
          bun run test
          bun run build
          bun run check:runtime

      - name: Validate Compose configuration
        env:
          MEWA_CODE_PORT: "24242"
          MEWA_CODE_TOKEN: ci-controller-token-0123456789abcdef0123456789
          MEWA_CODE_ALLOWED_ORIGINS: ""
          MEWA_BROWSER_TOKEN: ci-browser-token-0123456789abcdef0123456789
          MEWA_WORKSPACE_PATH: ${{ github.workspace }}/mewa-code
          MEWA_MOUNT_ROOTS: ${{ github.workspace }}
          MEWA_SSH_HOST: host.docker.internal
          MEWA_SSH_USER: ci
          MEWA_SSH_PORT: "22"
          MEWA_SSH_PRIVATE_KEY_FILE: /etc/hosts
          MEWA_SSH_KNOWN_HOSTS_FILE: /etc/hosts
        run: docker compose -f compose.yaml config --quiet

      - name: Validate isolated browser service
        working-directory: mewa-browser
        run: |
          bun run check
          bun run test

      - name: Commit validated rewrite
        run: |
          set -euo pipefail
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: simplify the Mewa product shell"
          git push origin HEAD:rewrite/mewa-code-foundation
