name: Export rewrite source

on:
  push:
    branches: ["rewrite/mewa-code-foundation"]
    paths:
      - ".github/workflows/export-source.yml"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: rewrite/mewa-code-foundation
          fetch-depth: 0

      - name: Create source archive
        run: tar --exclude=.git -czf /tmp/mewa-source.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: mewa-rewrite-source
          path: /tmp/mewa-source.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Remove temporary export workflow
        run: |
          git rm .github/workflows/export-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove temporary source export"
          git push origin HEAD:rewrite/mewa-code-foundation
