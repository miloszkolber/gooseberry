name: Temporary source export

on:
  push:
    branches: ["rewrite/mewa-code-foundation"]
    paths:
      - ".github/workflows/export-source.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Archive source
        run: tar --exclude=.git -czf /tmp/mewa-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: mewa-source
          path: /tmp/mewa-source.tar.gz
          if-no-files-found: error
          retention-days: 1
