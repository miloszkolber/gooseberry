name: CI

# Source, service-isolation and official Goose compatibility gates.
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "LICENSE"
      - "NOTICE.md"
      - "README.md"
      - "docker-compose.yaml"
      - "docker-compose.mcp.yaml"
      - ".dockerignore"
      - ".gooseberry.example"
      - "docs/**"
      - "gooseberry/**"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - ".github/workflows/**"
      - "LICENSE"
      - "NOTICE.md"
      - "README.md"
      - "docker-compose.yaml"
      - "docker-compose.mcp.yaml"
      - ".dockerignore"
      - ".gooseberry.example"
      - "docs/**"
      - "gooseberry/**"
  workflow_call:
    inputs:
      revision:
        description: Source commit to validate
        required: false
        type: string

# Supersede only runs of the same workflow and ref. The reusable invocation from
# the container-image workflow must not cancel the standalone CI run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Source validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: gooseberry/package.json
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: gooseberry/go.mod
          cache-dependency-path: gooseberry/go.sum
      - name: Cache bun install
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('gooseberry/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
        working-directory: gooseberry
      - run: bun run check:deps
        working-directory: gooseberry
      - run: bun audit --audit-level=high
        working-directory: gooseberry
      - run: bun run lint
        working-directory: gooseberry
      - run: bun run typecheck
        working-directory: gooseberry
      - run: bun run test
        working-directory: gooseberry
      - run: bun run build
        working-directory: gooseberry
      - name: Validate Compose service isolation
        run: sh gooseberry/tests/deployment/compose.test.sh
      - run: gofmt -d cmd internal tests | tee /tmp/gooseberry-gofmt.diff && test ! -s /tmp/gooseberry-gofmt.diff
        working-directory: gooseberry
      - run: go test -race -count=1 ./...
        env:
          CGO_ENABLED: "1"
        working-directory: gooseberry
      - run: go vet ./...
        env:
          CGO_ENABLED: "0"
        working-directory: gooseberry
  ui:
    name: Browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Build browser acceptance image
        run: docker build -f gooseberry/Dockerfile --target ui-acceptance -t gooseberry-ui-acceptance .
      - name: Run browser acceptance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ui
          chmod 0777 artifacts/ui
          container=""
          cleanup() {
            if [[ -n "$container" ]]; then
              docker rm -f "$container" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT
          container=$(docker create \
            --network none \
            --read-only \
            --shm-size 256m \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m,uid=1000,gid=1000 \
            --tmpfs /home/goose:rw,nosuid,nodev,size=64m,uid=1000,gid=1000 \
            --mount "type=bind,source=$PWD/artifacts/ui,target=/artifacts" \
            gooseberry-ui-acceptance)
          status=0
          docker start -a "$container" || status=$?
          exit "$status"
      - name: Keep browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ui-acceptance
          path: artifacts/ui
          if-no-files-found: warn
          retention-days: 14
  goose:
    name: Official Goose compatibility (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: gooseberry/go.mod
          cache-dependency-path: gooseberry/go.sum
      - name: Verify native workspace filesystem behavior
        run: CGO_ENABLED=0 go test -count=1 ./tests/go/workspace
        working-directory: gooseberry
      - name: Verify the pinned official GNU Linux executable
        env:
          ARCH: ${{ matrix.arch }}
          GOOSE_SERVER__SECRET_KEY: gooseberry-isolated-compatibility-check
          GOOSE_TELEMETRY_OFF: "true"
          GOOSE_TELEMETRY_ENABLED: "false"
          OTEL_SDK_DISABLED: "true"
        working-directory: gooseberry
        shell: bash
        run: |
          metadata=tests/goose/upstream.json
          repository=$(jq -er .repository "$metadata")
          version=$(jq -er .version "$metadata")
          asset=$(jq -er --arg arch "$ARCH" '.artifacts[$arch].name' "$metadata")
          checksum=$(jq -er --arg arch "$ARCH" '.artifacts[$arch].sha256' "$metadata")
          [[ "$repository" = aaif-goose/goose && "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$asset" =~ ^goose-(aarch64|x86_64)-unknown-linux-gnu\.tar\.gz$ && "$checksum" =~ ^[0-9a-f]{64}$ ]]
          smoke=$(mktemp -d)
          curl --fail --location --retry 3 --retry-all-errors --retry-max-time 300 \
            --connect-timeout 20 --max-time 120 --output "$smoke/goose.tar.gz" "https://github.com/$repository/releases/download/$version/$asset"
          printf '%s  %s\n' "$checksum" "$smoke/goose.tar.gz" | sha256sum --check --status -
          tar -xzf "$smoke/goose.tar.gz" -C "$smoke" ./goose
          actual=$("$smoke/goose" --version)
          actual=$(printf '%s' "$actual" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
          [[ "$actual" = "${version#v}" || "$actual" = "goose ${version#v}" ]]
          go build -trimpath -o "$smoke/acp-smoke" ./tests/goose
          source="$smoke/source"
          mkdir -p "$source/crates/goose/src/acp/server" "$source/ui/desktop/src/components/settings/extensions"
          for path in crates/goose/acp-meta.json crates/goose/acp-schema.json crates/goose/src/acp/server/custom_dispatch.rs ui/desktop/src/components/settings/extensions/bundled-extensions.json; do
            curl --fail --location --retry 3 --retry-all-errors --retry-max-time 120 \
              --connect-timeout 20 --max-time 60 --create-dirs --output "$source/$path" \
              "https://raw.githubusercontent.com/$repository/$version/$path"
          done
          mkdir "$smoke/home"
          env -u LANGFUSE_PUBLIC_KEY -u LANGFUSE_SECRET_KEY \
            HOME="$smoke/home" GOOSE_PATH_ROOT="$smoke/home" XDG_CONFIG_HOME="$smoke/home/.config" XDG_DATA_HOME="$smoke/home/.local/share" \
            "$smoke/goose" serve --host 127.0.0.1 --port 3284 --enable-scheduler > "$smoke/server.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || :; wait "$pid" 2>/dev/null || :; cat "$smoke/server.log"' EXIT
          for _ in $(seq 1 30); do
            kill -0 "$pid"
            if curl -fsS http://127.0.0.1:3284/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3284/health >/dev/null
          "$smoke/acp-smoke" -source "$source" -url ws://127.0.0.1:3284/acp
