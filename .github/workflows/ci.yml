name: CI

# Source, service-isolation and official Goose compatibility gates.
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "LICENSE"
      - "NOTICE.md"
      - "README.md"
      - "docker-compose.yaml"
      - ".dockerignore"
      - ".gooseberry.example"
      - "docs/**"
      - "gooseberry/**"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - ".github/workflows/**"
      - "LICENSE"
      - "NOTICE.md"
      - "README.md"
      - "docker-compose.yaml"
      - ".dockerignore"
      - ".gooseberry.example"
      - "docs/**"
      - "gooseberry/**"
  workflow_call:
    inputs:
      revision:
        description: Source commit to validate
        required: false
        type: string

# Supersede only runs of the same workflow and ref. The reusable invocation from
# the container-image workflow must not cancel the standalone CI run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Source validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: gooseberry/package.json
      - uses: actions/setup-go@v6
        with:
          go-version-file: gooseberry/go.mod
          cache-dependency-path: gooseberry/go.sum
      - name: Cache bun install
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('gooseberry/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
        working-directory: gooseberry
      - run: bun run check:deps
        working-directory: gooseberry
      - run: bun audit --audit-level=high
        working-directory: gooseberry
      - run: bun run lint
        working-directory: gooseberry
      - run: bun run typecheck
        working-directory: gooseberry
      - run: bun run test
        working-directory: gooseberry
      - run: bun run build
        working-directory: gooseberry
      - name: Validate Compose service isolation
        run: sh gooseberry/tests/deployment/compose.test.sh
      - run: gofmt -d main.go cmd controller browser tests/goose | tee /tmp/gooseberry-gofmt.diff && test ! -s /tmp/gooseberry-gofmt.diff
        working-directory: gooseberry
      - run: go test -race -count=1 ./...
        env:
          CGO_ENABLED: "1"
        working-directory: gooseberry
      - run: go vet ./...
        env:
          CGO_ENABLED: "0"
        working-directory: gooseberry
  goose:
    name: Official Goose compatibility (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: gooseberry/go.mod
          cache-dependency-path: gooseberry/go.sum
      - name: Verify the pinned official GNU Linux executable
        env:
          ARCH: ${{ matrix.arch }}
          GOOSE_SERVER__SECRET_KEY: gooseberry-isolated-compatibility-check
          GOOSE_TELEMETRY_OFF: "true"
          GOOSE_TELEMETRY_ENABLED: "false"
          OTEL_SDK_DISABLED: "true"
        working-directory: gooseberry
        shell: bash
        run: |
          metadata=tests/goose/upstream.json
          repository=$(jq -er .repository "$metadata")
          version=$(jq -er .version "$metadata")
          asset=$(jq -er --arg arch "$ARCH" '.artifacts[$arch].name' "$metadata")
          checksum=$(jq -er --arg arch "$ARCH" '.artifacts[$arch].sha256' "$metadata")
          [[ "$repository" = aaif-goose/goose && "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$asset" =~ ^goose-(aarch64|x86_64)-unknown-linux-gnu\.tar\.gz$ && "$checksum" =~ ^[0-9a-f]{64}$ ]]
          smoke=$(mktemp -d)
          curl --fail --location --retry 3 --output "$smoke/goose.tar.gz" "https://github.com/$repository/releases/download/$version/$asset"
          printf '%s  %s\n' "$checksum" "$smoke/goose.tar.gz" | sha256sum --check --status -
          tar -xzf "$smoke/goose.tar.gz" -C "$smoke" ./goose
          actual=$("$smoke/goose" --version)
          actual=$(printf '%s' "$actual" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
          [[ "$actual" = "${version#v}" || "$actual" = "goose ${version#v}" ]]
          go build -trimpath -o "$smoke/acp-smoke" ./tests/goose
          mkdir "$smoke/home"
          env -u LANGFUSE_PUBLIC_KEY -u LANGFUSE_SECRET_KEY \
            HOME="$smoke/home" GOOSE_PATH_ROOT="$smoke/home" XDG_CONFIG_HOME="$smoke/home/.config" XDG_DATA_HOME="$smoke/home/.local/share" \
            "$smoke/goose" serve --host 127.0.0.1 --port 3284 --enable-scheduler > "$smoke/server.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || :; wait "$pid" 2>/dev/null || :; cat "$smoke/server.log"' EXIT
          for _ in $(seq 1 30); do
            kill -0 "$pid"
            if curl -fsS http://127.0.0.1:3284/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3284/health >/dev/null
          "$smoke/acp-smoke" -url ws://127.0.0.1:3284/acp
