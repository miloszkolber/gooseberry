name: CI

# Fast structural gates for pull requests. Feature changes run focused tests chosen for their behavior.
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "compose.yaml"
      - ".env.example"
      - "mewa-code/**"
      - "mewa-browser/**"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - ".github/workflows/**"
      - "compose.yaml"
      - ".env.example"
      - "mewa-code/**"
      - "mewa-browser/**"
  workflow_call:

# Supersede only runs of the same workflow and ref. The reusable invocation from
# the container-image workflow must not cancel the standalone CI run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Source validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Cache bun install
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('mewa-code/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
        working-directory: mewa-code
      - run: bun run check:deps
        working-directory: mewa-code
      - run: bun run lint
        working-directory: mewa-code
      - run: bun run typecheck
        working-directory: mewa-code
      - run: bun run test
        working-directory: mewa-code
      - run: bun run build
        working-directory: mewa-code
      - run: bun run check:runtime
        working-directory: mewa-code
      - name: Validate Compose configuration
        env:
          MEWA_CODE_PORT: "24242"
          MEWA_CODE_TOKEN: ci-controller-token-0123456789abcdef0123456789
          MEWA_CODE_ALLOWED_ORIGINS: ""
          MEWA_BROWSER_TOKEN: ci-browser-token-0123456789abcdef0123456789
          MEWA_PROJECT_PATH: ${{ github.workspace }}/mewa-code
          MEWA_MOUNT_ROOTS: ${{ github.workspace }}
          MEWA_SSH_HOST: host.docker.internal
          MEWA_SSH_USER: ci
          MEWA_SSH_PORT: "22"
          MEWA_SSH_PRIVATE_KEY_FILE: /etc/hosts
          MEWA_SSH_KNOWN_HOSTS_FILE: /etc/hosts
        run: docker compose -f compose.yaml config --quiet
      - run: bun run check
        working-directory: mewa-browser
      - run: bun run test
        working-directory: mewa-browser
