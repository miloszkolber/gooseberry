name: Source snapshot

on:
  push:
    branches:
      - rewrite/mewa-code-work
  pull_request:
    branches:
      - rewrite/mewa-code-foundation

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Archive source
        run: tar --exclude=.git -czf /tmp/mewa-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: mewa-source-current
          path: /tmp/mewa-source.tar.gz
          retention-days: 1
