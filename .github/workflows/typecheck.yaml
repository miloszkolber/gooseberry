name: Typecheck mewa-code

on:
  push:
    branches: [main, "draft/**"]
    paths:
      - "mewa-code/**"
      - ".github/workflows/typecheck.yaml"
  pull_request:
    paths:
      - "mewa-code/**"
      - ".github/workflows/typecheck.yaml"

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - working-directory: mewa-code
        run: |
          npm install
          npx tsc -p tsconfig.check.json
