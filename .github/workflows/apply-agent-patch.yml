name: Apply agent patch

on:
  push:
    branches:
      - rewrite/mewa-code-implementation
    paths:
      - .agent-patch
      - .agent-message

permissions:
  contents: write

concurrency:
  group: apply-agent-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          test -s .agent-patch
          test -s .agent-message
          cp .agent-message /tmp/agent-message
          git apply --index --whitespace=error .agent-patch
          rm -f .agent-patch .agent-message .snapshot-trigger
          git add -A
      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          cd mewa-code
          bun install --frozen-lockfile
          bun --filter @mewa-code/web typography:generate
          bun --filter @mewa-code/web colors:generate
          bun run format
          bun run check:deps
          bun run lint
          bun run typecheck
          bun run test
          bun run build
          bun run check:runtime
          cd ../mewa-browser
          bun run check
          bun run test
          cd ..
          git add -A
      - name: Commit validated patch
        shell: bash
        run: |
          set -euo pipefail
          message="$(cat /tmp/agent-message)"
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git commit -m "$message"
          git push origin HEAD:rewrite/mewa-code-implementation
