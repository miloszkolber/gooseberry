name: Browser smoke test

on:
  push:
    branches: [main, "draft/**"]
    paths:
      - "mewa-browser/**"
      - ".github/workflows/browser-smoke.yaml"
  pull_request:
    paths:
      - "mewa-browser/**"
      - ".github/workflows/browser-smoke.yaml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Build browser image
        run: docker build -t mewa-browser:smoke mewa-browser

      - name: Run bounded browser flow
        env:
          TOKEN: browser-smoke-token
        run: |
          set -euo pipefail
          browser_state=$(mktemp -d)
          mkdir -p /tmp/mewa-site "$browser_state/artifacts"
          chmod 0777 "$browser_state" "$browser_state/artifacts"
          printf '<!doctype html><title>mewa smoke</title><button id="ok">Ready</button>\n' > /tmp/mewa-site/index.html
          python3 -m http.server 8099 --directory /tmp/mewa-site >/tmp/mewa-site.log 2>&1 &
          site_pid=$!

          docker run -d --name mewa-browser-smoke \
            --network host \
            --read-only \
            --shm-size 512m \
            --tmpfs /tmp:exec,nosuid,size=512m,mode=1777 \
            --tmpfs /run:nosuid,size=32m,mode=755 \
            --tmpfs /home/browser:nosuid,size=64m,mode=700,uid=1000,gid=1000 \
            -v "$browser_state:/state" \
            -e MEWA_BROWSER_TOKEN="$TOKEN" \
            mewa-browser:smoke

          cleanup() {
            docker logs mewa-browser-smoke || true
            docker rm -f mewa-browser-smoke >/dev/null 2>&1 || true
            kill "$site_pid" >/dev/null 2>&1 || true
            rm -rf "$browser_state"
          }
          trap cleanup EXIT

          ready=false
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/health >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true

          call() {
            local response status
            response=$(mktemp)
            status=$(curl -sS -o "$response" -w '%{http_code}' \
              -H "Authorization: Bearer $TOKEN" \
              -H 'Content-Type: application/json' \
              --data "$1" \
              http://127.0.0.1:8787/v1/browser)
            cat "$response"
            if [[ "$status" != 200 ]]; then
              printf '\nbrowser call returned HTTP %s\n' "$status" >&2
              rm -f "$response"
              return 1
            fi
            rm -f "$response"
          }

          call '{"session":"smoke","command":"open","args":["http://127.0.0.1:8099"]}'
          call '{"session":"smoke","command":"snapshot","args":["--compact"]}' | grep -q 'Ready'
          call '{"session":"smoke","command":"screenshot","args":["screen.png"]}' | grep -q 'screen.png'
          curl -fsS \
            -H "Authorization: Bearer $TOKEN" \
            http://127.0.0.1:8787/v1/artifacts/smoke/screen.png \
            -o /tmp/screen.png
          test -s /tmp/screen.png

          status=$(curl -sS -o /tmp/rejected.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{"session":"smoke","command":"open","args":["file:///etc/passwd"]}' \
            http://127.0.0.1:8787/v1/browser)
          test "$status" = 400
          grep -q 'invalid_request' /tmp/rejected.json

          call '{"session":"smoke","command":"close","args":[]}'
